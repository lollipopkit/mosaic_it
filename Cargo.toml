[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
repository = "https://github.com/lollipopkit/mosaic_it"
publish = false

[workspace.dependencies]
unseen-core = { path = "crates/unseen-core" }
unseen-infer = { path = "crates/unseen-infer" }
unseen-media = { path = "crates/unseen-media" }
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
ndarray = "0.17.2"
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "ndarray", "download-binaries", "copy-dylibs", "tls-rustls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"

[profile.release]
lto = "thin"
