# Model releases pinned by BLAKE3. Weights are not committed. Check files with
#   unseen models verify <model.onnx>...
# and add entries with `unseen models hash` (steps: docs/release.md). The sidecar (<file>.json) holds the
# classes and calibration, so recalibrating changes its hash.
#
# `models/publish.sh` uploads an entry's files to its `url` and this file,
# signed, to https://pub.lolli.tech/models/unseen/manifest.signed, where the app
# looks for a newer release. `format` (default 1) is raised when a release
# needs a newer app.
#
# 0.1.0 to 0.3.2 were trained on synthetic screenshots only and were not
# published (10 classes; 0.3.2 is 0.3.1's weights with a new calibration).
#
# 0.4.0: 15 classes (adds finance, organization, device_id and secret),
# trained on synthetic and labelled real screenshots (docs/model.md). The
# sidecar selects every class at 0.45 with no review band and certifies none.

