[package]
name = "unseen-media"
description = "Video decoding and encoding with the platform's own codecs"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
image.workspace = true
thiserror.workspace = true

[target.'cfg(target_os = "android")'.dependencies]
ndk = { version = "0.9", default-features = false, features = ["media", "api-level-28"] }
ndk-sys = "0.6"
yuvutils-rs = { version = "0.8", default-features = false }

[dev-dependencies]
yuvutils-rs = { version = "0.8", default-features = false }

[target.'cfg(target_vendor = "apple")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSURL", "NSArray", "NSDictionary", "NSValue", "NSError", "NSObject"] }
objc2-av-foundation = { version = "0.3", default-features = false, features = ["std", "objc2-core-media", "objc2-core-video", "AVAsset", "AVAssetReader", "AVAssetReaderOutput", "AVAssetTrack", "AVAssetWriter", "AVAssetWriterInput", "AVMediaFormat", "AVVideoSettings", "block2", "objc2-core-foundation"] }
objc2-core-media = { version = "0.3", default-features = false, features = ["std", "CMSampleBuffer", "CMTime", "CMFormatDescription", "objc2-core-video"] }
objc2-core-video = { version = "0.3", default-features = false, features = ["std", "CVPixelBuffer", "CVImageBuffer", "CVBuffer", "CVReturn", "CVPixelBufferPool", "CVBase", "CVImageBuffer"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFDictionary", "CFNumber", "CFString", "CFCGTypes"] }
