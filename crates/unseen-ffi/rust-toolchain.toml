# Required by the app's native-assets build (native_toolchain_rust): pins the
# toolchain and lists every target the app ships for.
[toolchain]
channel = "1.98.1"
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "aarch64-apple-ios",
  "aarch64-apple-ios-sim",
  "aarch64-linux-android",
  # Host of `flutter test` in CI.
  "x86_64-unknown-linux-gnu",
]
