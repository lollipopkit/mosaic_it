[package]
name = "unseen-cli"
description = "Command-line interface: detect and redact"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "unseen"
path = "src/main.rs"

[features]
default = []
coreml = ["unseen-infer/coreml"]
cuda = ["unseen-infer/cuda"]

[dependencies]
unseen-core.workspace = true
unseen-infer.workspace = true
unseen-media.workspace = true
anyhow.workspace = true
clap.workspace = true
image.workspace = true
serde.workspace = true
serde_json.workspace = true
dirs = "7.0.0"
