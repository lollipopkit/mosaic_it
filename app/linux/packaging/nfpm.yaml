# Shared nFPM specification for Debian (.deb) and RPM (.rpm) packages.
# Invoked via app/tool/package-linux-native.sh, which substitutes VERSION,
# BUNDLE_DIR, METAINFO_FILE, and BINARY_NAME before running `nfpm package`.
name: mosaicit
arch: amd64
platform: linux
version: "${VERSION}"
section: graphics
priority: optional
maintainer: "lollipopkit <10864310+lollipopkit@users.noreply.github.com>"
description: |
  On-device privacy redaction for screenshots.
  Automatically detect and redact sensitive personal details locally
  without network access.
vendor: lollipopkit
homepage: https://mosaic.lollipopkit.com/
license: AGPL-3.0-only

contents:
  - src: "${BUNDLE_DIR}/"
    dst: /opt/mosaicit
    type: tree
  - src: "/opt/mosaicit/${BINARY_NAME}"
    dst: /usr/bin/mosaicit
    type: symlink
    file_info:
      mode: 0777
  - src: app/linux/packaging/com.lollipopkit.unseen.desktop
    dst: /usr/share/applications/com.lollipopkit.unseen.desktop
    file_info:
      mode: 0644
  - src: "${METAINFO_FILE}"
    dst: /usr/share/metainfo/com.lollipopkit.unseen.metainfo.xml
    file_info:
      mode: 0644
  - src: app/assets/app_icon.png
    dst: /usr/share/icons/hicolor/512x512/apps/com.lollipopkit.unseen.png
    file_info:
      mode: 0644
  - src: LICENSE
    dst: /usr/share/licenses/mosaicit/LICENSE
    file_info:
      mode: 0644

scripts:
  postinstall: app/linux/packaging/scripts/refresh-desktop.sh
  postremove: app/linux/packaging/scripts/refresh-desktop.sh

rpm:
  group: Applications/Multimedia

overrides:
  deb:
    depends:
      - libgtk-3-0t64 | libgtk-3-0
      - libsecret-1-0
      - libepoxy0
      - libstdc++6
      - libgcc-s1
      - libatomic1
      - xdg-utils
  rpm:
    depends:
      - libgtk-3.so.0()(64bit)
      - libsecret-1.so.0()(64bit)
      - libepoxy.so.0()(64bit)
      - libstdc++.so.6()(64bit)
      - libgcc_s.so.1()(64bit)
      - libatomic.so.1()(64bit)
      - xdg-utils
