# Builds and publishes MosaicIt releases on admin-pushed `v1.0.<build>` tags
# (and supports manual `workflow_dispatch` test builds or selective job runs):
# - Versioning (ServerBox convention):
#   - Auto-generated from git commit count via `app/tool/bump-version.sh`:
#     `1.0.<build>+<build>` in `app/pubspec.yaml`, `BuildData.build` in
#     `app/lib/data/res/build_data.dart`, `1.0.<build>` in `Cargo.toml`,
#     and release tag `v1.0.<build>`.
# - Apps:
#   - Android arm64 signed APK (`MosaicIt_<tag>_arm64.apk`) via 1Password (`MosaicIt CI` vault)
#   - iOS arm64 unsigned IPA (`MosaicIt_<tag>_NoSign.ipa`)
#   - macOS arm64 unsigned DMG (`MosaicIt_<tag>_NoSign_arm64.dmg`)
#   - Linux amd64 AppImage (`MosaicIt_<tag>_amd64.AppImage`, ubuntu-latest)
#   - Linux amd64 legacy AppImage (`MosaicIt_<tag>_legacy_amd64.AppImage`, ubuntu-22.04)
#   - Linux amd64 Debian package (`MosaicIt_<tag>_amd64.deb`, ubuntu-22.04)
#   - Linux x86_64 RPM package (`MosaicIt_<tag>_x86_64.rpm`, ubuntu-22.04)
#   - Linux amd64 portable tarball (`MosaicIt_<tag>_linux_amd64.tar.gz`, ubuntu-22.04)
#   - Windows amd64 Inno Setup installer (`MosaicIt_<tag>_windows_amd64.exe`)
#   - Windows amd64 portable archive (`MosaicIt_<tag>_windows_amd64.zip`)
# - CLI (`unseen`):
#   - Linux amd64 (`unseen_<tag>_linux_amd64.tar.gz`)
#   - macOS arm64 (`unseen_<tag>_macos_arm64.tar.gz`, with CoreML)
#   - Windows amd64 (`unseen_<tag>_windows_amd64.zip`)
#
# Security model:
# - Tag releases require `v*` tags (protected by repository Tag Ruleset: admins only).
# - `OP_SERVICE_ACCOUNT_TOKEN` lives only in the `release` environment (restricted
#   to `v*` tags) and is scoped read-only to the dedicated `MosaicIt CI` vault.
# - Only the `android` job attaches `environment: release` on tag builds; all
#   other build jobs and `publish` cannot access the 1Password token.
# - Only the `publish` job receives `contents: write`.

name: Release

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish GitHub Release from the selected v1.0.<build> tag"
        required: false
        type: boolean
        default: false
      jobs:
        description: "Comma-separated jobs to run: android,ios,macos,linux,windows,cli (empty = all)"
        required: false
        type: string
        default: ""
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  APP_NAME: "MosaicIt"
  B3SUM_VERSION: "1.8.8"
  B3SUM_LINUX_X64_SHA256: "cf7a7a515dc55ffde63b65dad87c00dd5ea0a29c9edf2b6a58acbb37e9d161c3"
  B3SUM_WINDOWS_X64_SHA256: "9919f06ad1de83de7ad268da83dd2879b9ea8e943deaf451e7da30d37d62ebbb"

jobs:
  check:
    name: Validate release metadata
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      selected: ${{ steps.selection.outputs.selected }}
      buildNumber: ${{ steps.meta.outputs.build }}
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      isRelease: ${{ steps.meta.outputs.release }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require tagged releases
        if: inputs.release == true && github.ref_type != 'tag'
        shell: bash
        run: |
          echo "::error::Release builds must run from a v1.0.<build> tag."
          echo "Run app/tool/bump-version.sh, commit, and push the matching v1.0.<build> tag."
          exit 1
      - name: Check job selection
        id: selection
        shell: bash
        env:
          REQUESTED: ${{ inputs.jobs }}
          IS_DISPATCH: ${{ github.event_name == 'workflow_dispatch' }}
          IS_RELEASE: ${{ inputs.release }}
        run: |
          set -euo pipefail
          known="android ios macos linux windows cli"
          if [[ "$IS_DISPATCH" != "true" || -z "${REQUESTED//[[:space:]]/}" ]]; then
            selected="$known"
          else
            if [[ "$IS_RELEASE" == "true" ]]; then
              echo "::error::Cannot narrow job selection when publishing a release; leave jobs empty."
              exit 1
            fi
            selected=""
            bad=()
            IFS=',' read -ra requested <<< "$REQUESTED"
            for raw in "${requested[@]:-}"; do
              name="${raw#"${raw%%[![:space:]]*}"}"
              name="${name%"${name##*[![:space:]]}"}"
              [[ -z "$name" ]] && continue
              if [[ " $known " != *" $name "* ]]; then
                bad+=("$name")
                continue
              fi
              selected="$selected $name"
            done
            if (( ${#bad[@]} )); then
              echo "::error::Unknown job(s): ${bad[*]}. Valid names: $known"
              exit 1
            fi
            if [[ -z "${selected//[[:space:]]/}" ]]; then
              echo "::error::No jobs selected. Leave the field empty to run all jobs."
              exit 1
            fi
          fi
          canonical=",$(echo "$selected" | tr -s '[:space:]' ',' | sed 's/^,//;s/,$//'),"
          echo "selected=$canonical" >> "$GITHUB_OUTPUT"
          echo "Running:$selected"
      - name: Resolve and validate commit-count version
        id: meta
        shell: bash
        env:
          IS_DISPATCH: ${{ github.event_name == 'workflow_dispatch' }}
          WANTS_RELEASE: ${{ inputs.release }}
        run: |
          set -euo pipefail
          commit_count="$(git rev-list --count HEAD)"
          build_data="$(sed -n -E 's/.*static const int build = ([0-9]+);/\1/p' app/lib/data/res/build_data.dart | head -n 1)"
          pub_ver="$(sed -n -E 's/^version:[[:space:]]*([^+]+)\+([0-9]+)$/\1+\2/p' app/pubspec.yaml | head -n 1)"
          cargo_ver="$(python3 -c 'import tomllib, pathlib; print(tomllib.loads(pathlib.Path("Cargo.toml").read_text())["workspace"]["package"]["version"])')"

          if [[ -z "$build_data" ]]; then
            echo "::error::BuildData.build not found in app/lib/data/res/build_data.dart"
            exit 1
          fi

          release=false
          if [[ "$WANTS_RELEASE" == "true" ]]; then
            release=true
          elif [[ "$IS_DISPATCH" != "true" && "$GITHUB_REF_TYPE" == "tag" ]]; then
            release=true
          fi

          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            expected_tag="v1.0.${build_data}"
            if [[ "$GITHUB_REF_NAME" != "$expected_tag" ]]; then
              echo "::error::Tag ${GITHUB_REF_NAME} does not match BuildData.build (${expected_tag}). Run app/tool/bump-version.sh first."
              exit 1
            fi
            if [[ "$pub_ver" != "1.0.${build_data}+${build_data}" ]]; then
              echo "::error::app/pubspec.yaml version must be 1.0.${build_data}+${build_data}; got ${pub_ver}"
              exit 1
            fi
            if [[ "$cargo_ver" != "1.0.${build_data}" ]]; then
              echo "::error::Cargo.toml workspace version must be 1.0.${build_data}; got ${cargo_ver}"
              exit 1
            fi
            if [[ "$build_data" != "$commit_count" ]]; then
              echo "::notice::BuildData.build (${build_data}) differs from git commit count (${commit_count})."
            fi
            build="$build_data"
          else
            # Non-tag manual dispatch builds automatically use the live commit count.
            build="$commit_count"
          fi

          version="1.0.${build}"
          tag="v${version}"
          echo "build=${build}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "release=${release}" >> "$GITHUB_OUTPUT"
          echo "Resolved version=${version}+${build} tag=${tag} release=${release} (git commits=${commit_count})"

  android:
    name: Build Android app (arm64)
    if: needs.check.outputs.isRelease == 'true' || contains(needs.check.outputs.selected, ',android,')
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: ${{ github.ref_type == 'tag' && 'release' || '' }}
    permissions:
      contents: read
    env:
      BUILD_NUMBER: ${{ needs.check.outputs.buildNumber }}
      VERSION: ${{ needs.check.outputs.version }}
      TAG: ${{ needs.check.outputs.tag }}
      EXPECTED_CERT_SHA256: "a2da0498d4901b980ecef0f6ce3b720e775dd1f44236455e1095e5e6389f1164"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: zulu
          java-version: "21"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install Android NDK r28 and pinned b3sum
        shell: bash
        run: |
          set -euo pipefail
          ndk_version="28.2.13676358"
          { yes || true; } | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;${ndk_version}" >/dev/null
          ndk_dir="${ANDROID_HOME}/ndk/${ndk_version}"
          {
            echo "ANDROID_NDK=${ndk_dir}"
            echo "ANDROID_NDK_HOME=${ndk_dir}"
            echo "ANDROID_NDK_LATEST_HOME=${ndk_dir}"
            echo "ANDROID_NDK_ROOT=${ndk_dir}"
          } >> "$GITHUB_ENV"

          mkdir -p "$HOME/.local/bin"
          curl -fsSL \
            "https://github.com/BLAKE3-team/BLAKE3/releases/download/${B3SUM_VERSION}/b3sum_linux_x64_bin" \
            -o "$HOME/.local/bin/b3sum"
          echo "${B3SUM_LINUX_X64_SHA256}  $HOME/.local/bin/b3sum" | sha256sum -c -
          chmod 0755 "$HOME/.local/bin/b3sum"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Fetch Flutter dependencies
        working-directory: app
        shell: bash
        run: flutter pub get --enforce-lockfile
      - name: Install 1Password CLI
        if: github.ref_type == 'tag'
        uses: 1password/install-cli-action@1a3160d5e9de1ae0803eaa08a88746f5ae3daa50 # v4.1.0
        with:
          version: 2.42.0
      - name: Build Android arm64 APK
        working-directory: app
        shell: bash
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
        run: |
          set -euo pipefail
          args=(
            flutter build apk --release
            --target-platform android-arm64
            "--build-name=${VERSION}"
            "--build-number=${BUILD_NUMBER}"
          )
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            tool/android-signing.sh "${args[@]}"
          else
            "${args[@]}"
          fi
      - name: Verify APK signature, bundled model, and zero permissions
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail
          apk="build/app/outputs/flutter-apk/app-release.apk"
          out="build/app/outputs/flutter-apk/${APP_NAME}_${TAG}_arm64.apk"
          mv "$apk" "$out"

          bt_dir="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            certs="$("$bt_dir/apksigner" verify --print-certs "$out")"
            echo "$certs"
            grep -qF "certificate SHA-256 digest: ${EXPECTED_CERT_SHA256}" <<< "$certs" || {
              echo "::error::APK was not signed with the expected release certificate"
              exit 1
            }
          fi

          entries="$(zipinfo -1 "$out")"
          for required in \
            assets/models/unseen-det.tflite \
            assets/models/unseen-det.tflite.json \
            lib/arm64-v8a/libLiteRt.so \
            lib/arm64-v8a/libLiteRtClGlAccelerator.so \
            lib/arm64-v8a/libunseen_ffi.so; do
            grep -qFx "$required" <<< "$entries" || {
              echo "::error::Missing expected entry in APK: $required"
              exit 1
            }
          done

          perms="$("$bt_dir/aapt2" dump permissions "$out")"
          echo "$perms"
          if grep -qE "uses-permission(-sdk-[0-9]+)?: name='android\.permission\." <<< "$perms"; then
            echo "::error::Unexpected android.permission.* found in release APK"
            exit 1
          fi
      - name: Upload Android artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-android
          path: app/build/app/outputs/flutter-apk/${{ env.APP_NAME }}_${{ needs.check.outputs.tag }}_arm64.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload Android native debug symbols
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: symbols-${{ needs.check.outputs.tag }}-${{ github.run_number }}-android-arm64
          path: app/build/app/outputs/native-debug-symbols/release/native-debug-symbols.zip
          if-no-files-found: ignore
          retention-days: 90

  macos:
    name: Build macOS app unsigned (arm64)
    if: needs.check.outputs.isRelease == 'true' || contains(needs.check.outputs.selected, ',macos,')
    needs: check
    runs-on: macos-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      BUILD_NUMBER: ${{ needs.check.outputs.buildNumber }}
      VERSION: ${{ needs.check.outputs.version }}
      TAG: ${{ needs.check.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install b3sum
        shell: bash
        run: brew install b3sum
      - name: Configure ad-hoc unsigned macOS build
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail
          project="macos/Runner.xcodeproj/project.pbxproj"
          sed -i '' \
            -e 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' \
            -e 's/ProvisioningStyle = Automatic;/ProvisioningStyle = Manual;/g' \
            -e 's/DEVELOPMENT_TEAM = [^;]*;/DEVELOPMENT_TEAM = "";/g' \
            "$project"
      - name: Build macOS app
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get --enforce-lockfile
          flutter build macos --release \
            --build-name="${VERSION}" \
            --build-number="${BUILD_NUMBER}"
      - name: Verify architecture, bundled model, and package DMG
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail
          app_path="build/macos/Build/Products/Release/MosaicIt.app"
          test -f "$app_path/Contents/Resources/models/unseen-det-tile.onnx"
          test -f "$app_path/Contents/Resources/models/unseen-det-tile.onnx.json"
          test -d "$app_path/Contents/Frameworks/unseen_ffi.framework"
          codesign --verify --deep --strict "$app_path"

          checked=0
          bad=()
          while IFS= read -r -d '' binary; do
            archs="$(lipo -archs "$binary" 2>/dev/null)" || continue
            checked=$((checked + 1))
            if [[ " $archs " != *" arm64 "* ]]; then
              bad+=("${binary#"$app_path/"}: $archs")
            fi
          done < <(find "$app_path/Contents/MacOS" "$app_path/Contents/Frameworks" -type f -print0)
          if (( checked == 0 || ${#bad[@]} > 0 )); then
            echo "::error::Invalid Mach-O architectures (checked=$checked): ${bad[*]:-none}"
            exit 1
          fi

          stage="$(mktemp -d)"
          trap 'rm -rf "$stage"' EXIT
          ditto "$app_path" "$stage/MosaicIt.app"
          ln -s /Applications "$stage/Applications"
          mkdir -p build/release
          hdiutil create \
            -volname "MosaicIt" \
            -srcfolder "$stage" \
            -ov \
            -format UDZO \
            "build/release/${APP_NAME}_${TAG}_NoSign_arm64.dmg"
      - name: Upload macOS artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-macos
          path: app/build/release/${{ env.APP_NAME }}_${{ needs.check.outputs.tag }}_NoSign_arm64.dmg
          if-no-files-found: error
          retention-days: 14
      - name: Upload macOS dSYMs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: symbols-${{ needs.check.outputs.tag }}-${{ github.run_number }}-macos-arm64
          path: app/build/macos/Build/Products/Release/**/*.dSYM
          if-no-files-found: ignore
          retention-days: 90

  ios:
    name: Build iOS app unsigned (arm64)
    if: needs.check.outputs.isRelease == 'true' || contains(needs.check.outputs.selected, ',ios,')
    needs: check
    runs-on: macos-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      BUILD_NUMBER: ${{ needs.check.outputs.buildNumber }}
      VERSION: ${{ needs.check.outputs.version }}
      TAG: ${{ needs.check.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install b3sum
        shell: bash
        run: brew install b3sum
      - name: Build unsigned iOS app and package IPA
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get --enforce-lockfile
          flutter build ios --release --no-codesign \
            --build-name="${VERSION}" \
            --build-number="${BUILD_NUMBER}"

          app_path="build/ios/iphoneos/Runner.app"
          test -f "$app_path/models/unseen-det-tile.onnx"
          test -f "$app_path/models/unseen-det-tile.onnx.json"
          test -d "$app_path/Frameworks/unseen_ffi.framework"
          archs="$(lipo -archs "$app_path/Runner")"
          [[ " $archs " == *" arm64 "* ]] || {
            echo "::error::Runner binary is not arm64: $archs"
            exit 1
          }

          stage="$(mktemp -d)"
          trap 'rm -rf "$stage"' EXIT
          mkdir -p "$stage/Payload" build/release
          ditto "$app_path" "$stage/Payload/Runner.app"
          out="$PWD/build/release/${APP_NAME}_${TAG}_NoSign.ipa"
          (cd "$stage" && zip -qry "$out" Payload)
      - name: Upload iOS artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-ios
          path: app/build/release/${{ env.APP_NAME }}_${{ needs.check.outputs.tag }}_NoSign.ipa
          if-no-files-found: error
          retention-days: 14
      - name: Upload iOS dSYMs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: symbols-${{ needs.check.outputs.tag }}-${{ github.run_number }}-ios
          path: app/build/ios/Release-iphoneos/**/*.dSYM
          if-no-files-found: ignore
          retention-days: 90

  linux:
    name: Build Linux app (${{ matrix.runs_on }})
    if: needs.check.outputs.isRelease == 'true' || contains(needs.check.outputs.selected, ',linux,')
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs_on: ubuntu-latest
            release_suffix: ""
            artifact_suffix: ""
            package_native: false
          - runs_on: ubuntu-22.04
            release_suffix: "_legacy"
            artifact_suffix: "-legacy"
            # Built on ubuntu-22.04 (glibc 2.35) so .deb, .rpm, and portable
            # tarball run across Ubuntu 22.04+, Debian 12+, Fedora, and openSUSE.
            package_native: true
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      BUILD_NUMBER: ${{ needs.check.outputs.buildNumber }}
      VERSION: ${{ needs.check.outputs.version }}
      TAG: ${{ needs.check.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install Linux desktop dependencies and pinned b3sum
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libsecret-1-dev \
            desktop-file-utils

          mkdir -p "$HOME/.local/bin"
          curl -fsSL \
            "https://github.com/BLAKE3-team/BLAKE3/releases/download/${B3SUM_VERSION}/b3sum_linux_x64_bin" \
            -o "$HOME/.local/bin/b3sum"
          echo "${B3SUM_LINUX_X64_SHA256}  $HOME/.local/bin/b3sum" | sha256sum -c -
          chmod 0755 "$HOME/.local/bin/b3sum"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Build Linux app and bundle model
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get --enforce-lockfile
          flutter build linux --release \
            --build-name="${VERSION}" \
            --build-number="${BUILD_NUMBER}"

          bundle="build/linux/x64/release/bundle"
          tool/bundle-model.sh tiled "$bundle/models"

          test -x "$bundle/mosaicit"
          test -f "$bundle/models/unseen-det-tile.onnx"
          test -f "$bundle/models/unseen-det-tile.onnx.json"
          test -f "$bundle/lib/libunseen_ffi.so"
      - name: Package AppImage
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          app/tool/package-linux-appimage.sh \
            --bundle app/build/linux/x64/release/bundle \
            --output "dist/${APP_NAME}_${TAG}${{ matrix.release_suffix }}_amd64.AppImage"
      - name: Package deb, rpm, and portable tarball
        if: matrix.package_native
        shell: bash
        run: |
          set -euo pipefail
          app/tool/install-nfpm.sh "$RUNNER_TEMP/nfpm-bin"
          PATH="$RUNNER_TEMP/nfpm-bin:$PATH" app/tool/package-linux-native.sh \
            --bundle app/build/linux/x64/release/bundle \
            --version "${VERSION}" \
            --app-name "${APP_NAME}" \
            --out dist
      - name: Upload Linux artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-linux${{ matrix.artifact_suffix }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Build Windows app (amd64)
    if: needs.check.outputs.isRelease == 'true' || contains(needs.check.outputs.selected, ',windows,')
    needs: check
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      BUILD_NUMBER: ${{ needs.check.outputs.buildNumber }}
      VERSION: ${{ needs.check.outputs.version }}
      TAG: ${{ needs.check.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install pinned b3sum
        shell: bash
        run: |
          set -euo pipefail
          bin_dir="$(cygpath -u "${RUNNER_TEMP}")/bin"
          mkdir -p "$bin_dir"
          curl -fsSL \
            "https://github.com/BLAKE3-team/BLAKE3/releases/download/${B3SUM_VERSION}/b3sum_windows_x64_bin.exe" \
            -o "${bin_dir}/b3sum.exe"
          echo "${B3SUM_WINDOWS_X64_SHA256}  ${bin_dir}/b3sum.exe" | sha256sum -c -
          cygpath -w "$bin_dir" >> "$GITHUB_PATH"
      - name: Build Windows app and bundle model
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get --enforce-lockfile
          flutter build windows --release \
            --build-name="${VERSION}" \
            --build-number="${BUILD_NUMBER}"

          bundle="build/windows/x64/runner/Release"
          tool/bundle-model.sh tiled "$bundle/models"

          test -f "$bundle/MosaicIt.exe"
          test -f "$bundle/models/unseen-det-tile.onnx"
          test -f "$bundle/models/unseen-det-tile.onnx.json"
          test -f "$bundle/unseen_ffi.dll"
          test -f "$bundle/DirectML.dll"
      - name: Package Windows portable ZIP and Inno Setup installer
        working-directory: app
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path build\release | Out-Null
          $bundle = (Resolve-Path "build\windows\x64\runner\Release").Path
          $outDir = (Resolve-Path "build\release").Path

          # 1. Portable ZIP (single top-level folder).
          $stage = Join-Path $env:RUNNER_TEMP "mosaicit-win-stage"
          if (Test-Path $stage) { Remove-Item -Recurse -Force $stage }
          New-Item -ItemType Directory -Force -Path "$stage\$($env:APP_NAME)" | Out-Null
          Copy-Item -Recurse -Force "$bundle\*" "$stage\$($env:APP_NAME)\"
          Compress-Archive -Path "$stage\$($env:APP_NAME)" -DestinationPath "$outDir\$($env:APP_NAME)_$($env:TAG)_windows_amd64.zip" -Force

          # 2. Inno Setup 6 installer (.exe), matching ServerBox conventions.
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path -PathType Leaf $iscc)) {
            throw "Inno Setup 6 compiler not found at $iscc"
          }
          & $iscc /Q `
            "/DAppName=$($env:APP_NAME)" `
            "/DAppVersion=$($env:VERSION)" `
            "/DSourceDir=$bundle" `
            "/DOutputDir=$outDir" `
            "/DOutputBaseFilename=$($env:APP_NAME)_$($env:TAG)_windows_amd64" `
            "windows\installer.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC.exe exited with code $LASTEXITCODE" }

          if (-not (Test-Path -PathType Leaf "$outDir\$($env:APP_NAME)_$($env:TAG)_windows_amd64.exe")) {
            throw "Missing expected Windows installer .exe"
          }
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-windows
          path: |
            app/build/release/${{ env.APP_NAME }}_${{ needs.check.outputs.tag }}_windows_amd64.exe
            app/build/release/${{ env.APP_NAME }}_${{ needs.check.outputs.tag }}_windows_amd64.zip
          if-no-files-found: error
          retention-days: 14

  cli:
    name: Build CLI (${{ matrix.target }})
    if: needs.check.outputs.isRelease == 'true' || contains(needs.check.outputs.selected, ',cli,')
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux_amd64
            os: ubuntu-latest
            features: ""
            ext: ""
            archive: tar.gz
          - target: macos_arm64
            os: macos-latest
            features: "--features coreml"
            ext: ""
            archive: tar.gz
          - target: windows_amd64
            os: windows-latest
            features: ""
            ext: ".exe"
            archive: zip
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      TAG: ${{ needs.check.outputs.tag }}
      TARGET: ${{ matrix.target }}
      FEATURES: ${{ matrix.features }}
      EXT: ${{ matrix.ext }}
      ARCHIVE: ${{ matrix.archive }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build unseen CLI
        shell: bash
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086
          cargo build --release -p unseen-cli ${FEATURES}
          "./target/release/unseen${EXT}" --help >/dev/null
      - name: Package CLI (tar.gz)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          set -euo pipefail
          stage="$(mktemp -d)"
          trap 'rm -rf "$stage"' EXIT
          mkdir -p "$stage/unseen" build/release
          cp "target/release/unseen${EXT}" "$stage/unseen/"
          cp LICENSE "$stage/unseen/"
          shopt -s nullglob
          for lib in target/release/libonnxruntime*.so* target/release/libonnxruntime*.dylib; do
            cp -L "$lib" "$stage/unseen/"
          done
          tar -C "$stage" -czf "build/release/unseen_${TAG}_${TARGET}.tar.gz" unseen
      - name: Package CLI (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path build/release | Out-Null
          $stage = Join-Path $env:RUNNER_TEMP "unseen-cli-stage"
          if (Test-Path $stage) { Remove-Item -Recurse -Force $stage }
          New-Item -ItemType Directory -Force -Path "$stage\unseen" | Out-Null
          Copy-Item "target\release\unseen.exe" "$stage\unseen\"
          Copy-Item "LICENSE" "$stage\unseen\"
          Get-ChildItem "target\release\onnxruntime*.dll","target\release\DirectML.dll" -ErrorAction SilentlyContinue | Copy-Item -Destination "$stage\unseen\"
          if (-not (Test-Path -PathType Leaf "$stage\unseen\DirectML.dll")) { throw "Missing DirectML.dll next to unseen.exe" }
          Compress-Archive -Path "$stage\unseen" -DestinationPath "build\release\unseen_$($env:TAG)_$($env:TARGET).zip" -Force
      - name: Upload CLI artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-cli-${{ matrix.target }}
          path: build/release/unseen_${{ needs.check.outputs.tag }}_${{ matrix.target }}.${{ matrix.archive }}
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub Release
    if: needs.check.outputs.isRelease == 'true'
    needs: [check, android, macos, ios, linux, windows, cli]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      TAG: ${{ needs.check.outputs.tag }}
    steps:
      - name: Collect platform artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: release-*
          path: assets
          merge-multiple: true
      - name: Install pinned b3sum
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          curl -fsSL \
            "https://github.com/BLAKE3-team/BLAKE3/releases/download/${B3SUM_VERSION}/b3sum_linux_x64_bin" \
            -o "$HOME/.local/bin/b3sum"
          echo "${B3SUM_LINUX_X64_SHA256}  $HOME/.local/bin/b3sum" | sha256sum -c -
          chmod 0755 "$HOME/.local/bin/b3sum"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Verify expected assets, prune extras, and write checksums
        working-directory: assets
        shell: bash
        run: |
          set -euo pipefail
          expected=(
            "${APP_NAME}_${TAG}_arm64.apk"
            "${APP_NAME}_${TAG}_NoSign.ipa"
            "${APP_NAME}_${TAG}_NoSign_arm64.dmg"
            "${APP_NAME}_${TAG}_amd64.AppImage"
            "${APP_NAME}_${TAG}_legacy_amd64.AppImage"
            "${APP_NAME}_${TAG}_amd64.deb"
            "${APP_NAME}_${TAG}_x86_64.rpm"
            "${APP_NAME}_${TAG}_linux_amd64.tar.gz"
            "${APP_NAME}_${TAG}_windows_amd64.exe"
            "${APP_NAME}_${TAG}_windows_amd64.zip"
            "unseen_${TAG}_linux_amd64.tar.gz"
            "unseen_${TAG}_macos_arm64.tar.gz"
            "unseen_${TAG}_windows_amd64.zip"
          )

          missing=()
          for f in "${expected[@]}"; do
            [[ -f "$f" ]] || missing+=("$f")
          done
          if (( ${#missing[@]} )); then
            echo "::error::Release is incomplete, missing: ${missing[*]}"
            exit 1
          fi

          while IFS= read -r -d '' path; do
            name="${path#./}"
            keep=false
            for want in "${expected[@]}"; do
              if [[ "$name" == "$want" ]]; then keep=true; break; fi
            done
            if [[ "$keep" == false ]]; then rm -rf "$path"; fi
          done < <(find . -depth -mindepth 1 -print0)

          b3sum -- "${expected[@]}" > BLAKE3SUMS
          sha256sum -- "${expected[@]}" > SHA256SUMS
          cat BLAKE3SUMS
          cat SHA256SUMS
      - name: Stage draft release
        id: stage
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          tag_name: ${{ env.TAG }}
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ steps.stage.outputs.id }}
        run: |
          set -euo pipefail
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID:?missing release id}" \
            -F draft=false \
            -f make_latest="true" >/dev/null
