# Shipped artifacts may only depend on permissively licensed crates, so the
# maintainer can relicense under the CLA. See CONTRIBUTING.md.
[licenses]
allow = ["Apache-2.0", "Apache-2.0 WITH LLVM-exception", "MIT", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Zlib", "MPL-2.0", "Unicode-3.0", "CDLA-Permissive-2.0", "BSL-1.0"]
confidence-threshold = 0.9

[licenses.private]
# Our own crates (publish = false, AGPL-3.0-only).
ignore = true

[bans]
multiple-versions = "allow"
