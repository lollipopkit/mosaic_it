name = "unseen-feedback"
main = "src/index.ts"
compatibility_date = "2026-01-01"
workers_dev = true

routes = [
  { pattern = "mosaic.lollipopkit.com/feedback", zone_name = "lollipopkit.com" },
  { pattern = "mosaic.lollipopkit.com/feedback/*", zone_name = "lollipopkit.com" },
  { pattern = "mosaic.lollipopkit.com/v1/feedback", zone_name = "lollipopkit.com" },
  { pattern = "mosaic.lollipopkit.com/health", zone_name = "lollipopkit.com" },
]

[vars]
MAX_IMAGE_BYTES = "4194304"
MAX_PAYLOAD_BYTES = "65536"
TURNSTILE_SITE_KEY = "0x4AAAAAAGVkbeBA2Wp-4aE-"
TURNSTILE_ALLOWED_HOSTNAMES = "mosaic.lollipopkit.com,unseen-feedback.lollipopkit.workers.dev"

[[r2_buckets]]
binding = "FEEDBACK_BUCKET"
bucket_name = "unseen-feedback"

# Edge rate limiting: 20 submissions per minute per client IP.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 20, period = 60 }
